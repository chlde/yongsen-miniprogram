spring:
  profiles:
    default: local
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: jdbc:h2:file:${TRAINING_DATA_DIR:./data}/training;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${TRAINING_DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB
server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  error:
    include-message: never
training:
  data-dir: ${TRAINING_DATA_DIR:./data}
  wechat-mode: ${WECHAT_MODE:mock}
  appid: ${WECHAT_APPID:local-yongsen}
  app-secret: ${WECHAT_APP_SECRET:}
  callback-token: ${WECHAT_CALLBACK_TOKEN:}
  callback-aes-key: ${WECHAT_CALLBACK_AES_KEY:}
  admin-password: ${TRAINING_ADMIN_PASSWORD:LocalTrain123!}
  public-base: ${TRAINING_PUBLIC_BASE:http://127.0.0.1:${SERVER_PORT:8080}}
  ffprobe: ${FFPROBE_PATH:ffprobe}
  pdftoppm: ${PDFTOPPM_PATH:pdftoppm}
  pdfinfo: ${PDFINFO_PATH:pdfinfo}
  max-upload-bytes: ${TRAINING_MAX_UPLOAD_BYTES:524288000}
